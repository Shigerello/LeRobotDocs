site_name: LeRobot AWS 講習会・受講者ガイド
docs_dir: docs-aws-attendee
site_dir: site-aws-attendee
strict: true
theme:
  name: material
  custom_dir: theme-aws-attendee
  language: ja
  palette:
    primary: yellow
    accent: black
  logo: assets/logo.png
  favicon: assets/favicon.png
plugins:
- search
- macros:
    module_name: aws_guide_macros
    include_dir: guide-includes
    j2_variable_start_string: <<=
    j2_variable_end_string: =>>
    on_undefined: strict
    on_error_fail: true
    j2_comment_start_string: '{##'
    j2_comment_end_string: '##}'
markdown_extensions:
- pymdownx.highlight:
    use_pygments: true
    noclasses: false
    pygments_style: monokai
    linenums: false
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.superfences
- admonition
- pymdownx.keys
- attr_list
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
nav:
- はじめに: index.md
- LeRobot:
  - 実習の進め方: aws-workflow.md
  - 接続の確認: lerobot/check.md
  - 各種値の設定: common.md
  - キャリブレーション: lerobot/calibration.md
  - カメラの調整: lerobot/camera.md
  - データセットの収集: lerobot/collect.md
  - データセットの編集: lerobot/edit.md
  - 学習: lerobot/train.md
  - 推論の実行: lerobot/run.md
- AWS連携:
  - PC の準備と更新: setup.md
  - 接続と Git: connect.md
  - 教材とデータ確認: dataset.md
  - AWS へのデータ転送: aws-transfer.md
  - AWS からのモデル回収: aws-model-recovery.md
  - 保存と回収: save.md
  - 終了時の片付け: finish.md
- 困ったとき: troubleshooting.md
- 出典と検証範囲: verification.md
extra_css:
- assets/custom.css
- assets/lerobot_ports.css
- assets/aws-values.css
extra_javascript:
- assets/aws-values.js
extra:
  audience: attendee
exclude_docs: 'staff/

  '
watch:
- guide-includes
- aws_guide_macros.py
